<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — SpeakUp </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <style>
    .nf {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--cobalt);
      color: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }

    .nf::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      border: 60px solid rgba(255, 255, 255, .07);
      inset-inline-end: -160px;
      bottom: -200px;
    }

    .nf .brand {
      color: #fff;
    }

    .nf__top {
      padding: 24px var(--gutter);
    }

    .nf__body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      padding: 0 var(--gutter) 64px;
      max-width: 900px;
    }

    .nf__code {
      font-family: var(--font-display);
      font-stretch: 112%;
      font-weight: 900;
      font-size: clamp(110px, 24vw, 280px);
      line-height: .8;
      letter-spacing: -.05em;
      color: var(--hl);
    }

    .nf__code span {
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    .nf__code span:nth-child(2) {
      animation-delay: -1.3s;
      color: #fff;
    }

    .nf__code span:nth-child(3) {
      animation-delay: -2.6s;
    }

    .nf p {
      color: rgba(255, 255, 255, .86);
      max-width: 44ch;
      font-size: 18px;
    }
  </style>
  <script>
    document.documentElement.classList.add('js');
    try {
      var t = localStorage.getItem('hr_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) { }
  </script>
</head>

<body data-shell="none">
  <div class="nf">
    <div class="nf__top"><a class="brand" href="index.html" aria-label="SpeakUp  home"><svg class="brandMark"
          aria-hidden="true">
          <use href="#i-logo" />
        </svg><span class="brandName">SpeakUp </span></a></div>
    <main class="nf__body" id="main">
      <div class="nf__code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
      <h1 class="h1" style="color:#fff">This page doesn’t exist</h1>
      <p>The link may be broken or the page may have moved. Head back to somewhere that does.</p>
      <div class="row">
        <a class="btn btnAccent lagreBtn" href="index.html">Go to home</a>
        <a class="btn btnOutline lagreBtn" style="color:#fff" href="dashboard.html">Open dashboard</a>
      </div>
    </main>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"

      <path d="M9 16.5l4.5 4.5L23 11" fill="none" stroke="#0D1128" stroke-width="3.2" stroke-linecap="round"

  <script src="js/main.js"></script>

</html>
